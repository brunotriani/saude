<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Saúde Integral</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saúde">
<meta name="theme-color" content="#0B7C93">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: app em coluna única no celular (máx. 760px) e painel em duas colunas no computador (máx. 1080px). Barra de abas inferior translúcida; no computador vira uma barra flutuante. Estilo iOS: fundo agrupado, cartões arredondados, fonte do sistema, números grandes. */
:root{
  --bg:#F1F4F5; --card:#FFFFFF; --card-2:#E9EEF0; --seg-on:#FFFFFF; --ink:#0E0E11; --muted:#6C6C72; --line:#E2E8EA; --edge:rgb(0 0 0 / .045);
  --accent:#0B7C93; --accent-ink:#FFFFFF; --pos:#1E8E4E; --neg:#D9342B; --warn:#B86E00;
  --h-blue:#007AFF; --h-green:#24A148; --h-orange:#F28A00; --h-red:#F0352B; --h-purple:#A94FD6; --h-teal:#1597B5; --h-pink:#F02A57; --h-yellow:#C99700; --h-indigo:#5856D6; --h-gray:#8E8E93;
  --shadow:0 1px 2px rgb(16 24 40 / .04), 0 6px 20px rgb(16 24 40 / .05);
  --bar-bg:rgb(249 249 251 / .82); --scrim:rgb(0 0 0 / .32);
  --f:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-d:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card-2:#2C2C2E; --seg-on:#48484A; --ink:#F5F5F7; --muted:#8E8E93; --line:#2C2C2F; --edge:rgb(255 255 255 / .06);
  --accent:#4CC6DE; --accent-ink:#00262E; --pos:#30D158; --neg:#FF453A; --warn:#FF9F0A;
  --h-blue:#0A84FF; --h-green:#30D158; --h-orange:#FF9F0A; --h-red:#FF453A; --h-purple:#BF5AF2; --h-teal:#40C8E0; --h-pink:#FF375F; --h-yellow:#FFD60A; --h-indigo:#7D7AFF; --h-gray:#98989F;
  --shadow:none; --bar-bg:rgb(18 18 20 / .78); --scrim:rgb(0 0 0 / .6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card-2:#2C2C2E; --seg-on:#48484A; --ink:#F5F5F7; --muted:#8E8E93; --line:#2C2C2F; --edge:rgb(255 255 255 / .06);
  --accent:#4CC6DE; --accent-ink:#00262E; --pos:#30D158; --neg:#FF453A; --warn:#FF9F0A;
  --h-blue:#0A84FF; --h-green:#30D158; --h-orange:#FF9F0A; --h-red:#FF453A; --h-purple:#BF5AF2; --h-teal:#40C8E0; --h-pink:#FF375F; --h-yellow:#FFD60A; --h-indigo:#7D7AFF; --h-gray:#98989F;
  --shadow:none; --bar-bg:rgb(18 18 20 / .78); --scrim:rgb(0 0 0 / .6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:16px;line-height:1.4;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
.ic{width:22px;height:22px;flex:none;display:block}
b,strong{font-weight:600}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn-t{color:var(--warn)}
.muted{color:var(--muted)} .small{font-size:13px}
.amt,.big,.v,.hero-stats b,.flow-row b,.stat b,table.mini td:last-child,.num{font-variant-numeric:tabular-nums}

/* Barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bar-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font:600 17px/1 var(--f-d);letter-spacing:-.02em}
.appicon{display:grid;place-items:center;color:#fff;border-radius:9px;width:30px;height:30px;background:linear-gradient(145deg,#3FC9E0,#0B7C93 60%,#085E70);box-shadow:inset 0 0 0 .5px rgb(255 255 255 / .25)}
.appicon .ic{width:18px;height:18px}
.appicon.lg{width:68px;height:68px;border-radius:18px;margin:0 auto}
.appicon.lg .ic{width:36px;height:36px}
.hdr-actions{display:flex;align-items:center;gap:2px}
.icon-btn{appearance:none;border:0;background:transparent;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--card-2)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-right:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--h-gray)}
.dot.on{background:var(--pos);box-shadow:0 0 0 3px color-mix(in srgb,var(--pos) 22%,transparent)}

/* Página */
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 132px}
@media (min-width:1000px){.wrap{max-width:1080px}}
main{display:flex;flex-direction:column;gap:14px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:14px}
.pagehead h1{font:700 32px/1.12 var(--f-d);letter-spacing:-.028em;margin:0;text-wrap:balance}
.pagehead p{margin:4px 0 0;color:var(--muted);font-size:15px}
.dash{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:1000px){.dash{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}}
.stack{display:flex;flex-direction:column;gap:14px}

/* Cartões */
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--edge);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.card-head h3,h3{font:600 17px/1.25 var(--f-d);letter-spacing:-.02em;margin:0}
.label{font-size:13px;color:var(--muted);font-weight:500}
.foot{font-size:12.5px;color:var(--muted);margin:10px 0 0;line-height:1.45}
.hero{background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--accent) 16%,transparent) 0%,transparent 55%),var(--card)}
.big{font:700 40px/1.08 var(--f-d);letter-spacing:-.035em;margin:6px 0 2px;overflow-wrap:anywhere}
.cents{font-size:.55em;font-weight:600;color:var(--muted);letter-spacing:-.01em}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.hero-stats div{display:flex;flex-direction:column;gap:3px;min-width:0}
.hero-stats .label{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-stats b{font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;min-width:0}
.kpi-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:500;line-height:1.2}
.kpi-label .tile{width:28px;height:28px;border-radius:8px}
.kpi-label .tile .ic{width:16px;height:16px}
.kpi .v{font:700 23px/1.15 var(--f-d);letter-spacing:-.03em;margin-top:14px;overflow-wrap:anywhere}
.kpi .v.txt{font-size:19px;letter-spacing:-.02em}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.35}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.stat b{font:700 17px/1.2 var(--f-d);letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{font-size:11.5px;color:var(--muted)}

/* Ícones em quadrado colorido */
.tile{--hue:var(--h-gray);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--hue);background:color-mix(in srgb,var(--hue) 15%,transparent)}
.tile .ic{width:19px;height:19px}
.tile.mono{font:700 13px/1 var(--f-d);letter-spacing:-.01em}

/* Listas */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;min-width:0;position:relative}
.item + .item::before{content:"";position:absolute;top:0;left:48px;right:0;border-top:1px solid var(--line)}
.item .main{flex:1;min-width:0}
.item .t{font-size:15.5px;font-weight:500;overflow-wrap:anywhere;line-height:1.3}
.item .m{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.item .amt{font-size:15.5px;font-weight:600;white-space:nowrap;text-align:right;letter-spacing:-.015em}
.item .amt .m{font-weight:500}
.item .chev{color:var(--muted);width:16px;height:16px}
.dayhead{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:14px 0 2px}
.dayhead:first-child{padding-top:2px}
.flow{display:flex;flex-direction:column}
.flow-row{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:15px}
.flow-row + .flow-row{border-top:1px solid var(--line)}
.flow-row>span:not(.tile){flex:1;min-width:0}
.flow-row b{white-space:nowrap;font-size:15.5px}
.flow-row.total{padding-top:12px}
.flow-row.total span{font-weight:600}
.flow-row.total b{font:700 19px/1.2 var(--f-d);letter-spacing:-.025em}
[role=button]{cursor:pointer}
.card[role=button]:hover,.item[role=button]:hover .t{opacity:.86}

/* Controles */
.btn{appearance:none;border:0;background:var(--card-2);color:var(--ink);border-radius:12px;height:42px;padding:0 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sm{height:32px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.full{width:100%;margin-top:6px}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.5;cursor:default}
.link{appearance:none;border:0;background:transparent;color:var(--accent);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:2px;padding:4px 0}
.link .ic{width:16px;height:16px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.days{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:1000px){.days{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.hora{width:44px;flex:none;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .item + .item::before{left:104px}
.tl-check{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
details summary{list-style:none} details summary::-webkit-details-marker{display:none}
@media (max-width:520px){.toolrow .btn span{display:none}.toolrow .btn{padding:0 12px}}
.mini-sel{margin-top:6px;max-width:100%;border:0;background:var(--card-2);color:var(--ink);border-radius:8px;padding:5px 8px;font-size:13px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg{display:flex;background:var(--card-2);border-radius:11px;padding:2px;gap:2px;overflow-x:auto;scrollbar-width:none;flex:none;max-width:100%}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:9px;padding:7px 14px;font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--muted)}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.seg.sm button{padding:5px 10px;font-size:12.5px}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav b{font:600 17px/1 var(--f-d);letter-spacing:-.02em}
.search{min-width:0;display:flex;align-items:center;gap:8px;background:var(--card-2);border-radius:12px;padding:0 12px;color:var(--muted)}
.search .ic{width:18px;height:18px}
.search input{flex:1;min-width:0;border:0;background:transparent;height:40px;font-size:16px;color:var(--ink);outline:none}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--card-2);color:var(--muted);white-space:nowrap;vertical-align:1px;margin-left:4px;letter-spacing:0}
.chip.good{color:var(--pos);background:color-mix(in srgb,var(--pos) 14%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.chip.bad{color:var(--neg);background:color-mix(in srgb,var(--neg) 14%,transparent)}
.chip.ex{color:var(--h-purple);background:color-mix(in srgb,var(--h-purple) 14%,transparent)}
.bar{height:6px;background:var(--card-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar>i.warn{background:var(--warn)} .bar>i.bad{background:var(--neg)}
.stacked{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin:6px 0 10px}
.stacked i{display:block;height:100%}
.legend{display:flex;align-items:center;gap:8px;font-size:13px}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.btn:focus-visible,.tab:focus-visible,.icon-btn:focus-visible,.link:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible,.seg button:focus-visible,.step:focus-visible{outline:2px solid var(--h-blue);outline-offset:2px}

/* Avisos */
.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;font-size:14px;background:color-mix(in srgb,var(--h-purple) 12%,var(--card));border:1px solid color-mix(in srgb,var(--h-purple) 22%,transparent)}
.banner>.ic{color:var(--h-purple);width:20px;height:20px}
.banner span{flex:1;min-width:0}
.banner.warn{background:color-mix(in srgb,var(--warn) 12%,var(--card));border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.banner.warn>.ic{color:var(--warn)}
.callout{border-radius:14px;padding:12px 14px;font-size:14px;background:var(--card-2);line-height:1.45}
.callout b{color:var(--ink)}
.note{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:14.5px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .tile{width:48px;height:48px;border-radius:14px}
.empty .tile .ic{width:24px;height:24px}

/* Boas-vindas */
.welcome{text-align:center;padding:24px 16px 12px}
.welcome h3{font-size:22px;margin-top:14px}
.welcome>p{color:var(--muted);margin:6px auto 16px;max-width:36ch;font-size:15px}
.steps{display:flex;flex-direction:column;text-align:left}
.step{appearance:none;border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:11px 0;width:100%;text-align:left;position:relative}
.step + .step::before{content:"";position:absolute;top:0;left:48px;right:0;border-top:1px solid var(--line)}
.step span{flex:1;display:flex;flex-direction:column;gap:2px}
.step small{color:var(--muted);font-size:13px}
.step>.ic{color:var(--muted);width:16px;height:16px}

/* Gráfico */
.chart{width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}

/* Barra de abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:flex;max-width:760px;margin:0 auto}
.tab{flex:1;border:0;background:transparent;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:0}
.tab .ic{width:25px;height:25px}
.tab.on{color:var(--accent)}
@media (min-width:700px){
  nav.tabs{left:50%;right:auto;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));border:1px solid var(--line);border-radius:22px;padding:4px;box-shadow:0 10px 30px rgb(0 0 0 / .12)}
  .tab{flex-direction:row;justify-content:center;gap:7px;font-size:13px;padding:10px 6px;border-radius:16px}
  .tab .ic{width:20px;height:20px}
  .tab.on{background:color-mix(in srgb,var(--accent) 13%,transparent)}
}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:21;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab .ic{width:26px;height:26px}
@media (min-width:700px){.fab{bottom:calc(24px + env(safe-area-inset-bottom,0px));right:calc(max(24px,(100vw - 1080px)/2) + env(safe-area-inset-right,0px))}}

/* Janela de formulário */
.sheet-bg{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.grabber{width:38px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 10px}
.sheet-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-title h3{font-size:20px}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px;padding-top:18px}.grabber{display:none}}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.inp{width:100%;border:1px solid transparent;background:var(--card-2);border-radius:12px;padding:11px 12px;font-size:16px;font-weight:400;color:var(--ink);min-width:0}
label.f input:focus,label.f select:focus,label.f textarea:focus,.inp:focus{border-color:var(--h-blue);outline:none}
label.f .hint{font-weight:400;font-size:12px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink)}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.err{color:var(--neg);font-size:13.5px;min-height:1.2em}
table.mini{width:100%;border-collapse:collapse;font-size:14.5px}
table.mini td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.mini tr:last-child td{border-bottom:0}
table.mini td:last-child{white-space:nowrap;text-align:right;padding-left:12px;font-weight:500}
.lot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding-top:4px;color:var(--muted)}

<script>
/* =====================================================================
   SAÚDE INTEGRAL — app pessoal (uso exclusivo do dono)
   Mesmo motor da Caderneta: dados criptografados no aparelho (AES-GCM),
   sincronização opcional pelo Firebase gratuito, sem servidor próprio.
   Nenhum dado pessoal fica escrito neste código: tudo vive no banco cifrado.
   ===================================================================== */
const APP = 'saude', VERSION = '1.1';

/* ===================== CRIPTOGRAFIA ===================== */
const CRYPTO = (() => {
  const te = new TextEncoder(), td = new TextDecoder();
  const b64 = buf => { const a = new Uint8Array(buf); let s = ''; for (let i=0;i<a.length;i+=0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i+0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function derive(user, pass, saltB64, iter){
    const base = await crypto.subtle.importKey('raw', te.encode(user.trim().toLowerCase() + '\n' + pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:unb64(saltB64), iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  }
  async function enc(key, obj){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, te.encode(JSON.stringify(obj))); return {iv:b64(iv), ct:b64(ct)}; }
  async function dec(key, rec){ const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(rec.iv)}, key, unb64(rec.ct)); return JSON.parse(td.decode(pt)); }
  async function encBytes(key, bytes){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, bytes); return {iv:b64(iv), ct:b64(ct)}; }
  async function decBytes(key, rec){ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(rec.iv)}, key, unb64(rec.ct))); }
  const newSalt = () => b64(crypto.getRandomValues(new Uint8Array(16)));
  return { derive, enc, dec, encBytes, decBytes, newSalt, b64, unb64, ITER: 250000 };
})();

/* ===================== UTIL ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const toD = s => { const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = toD(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a, b) => Math.round((toD(b) - toD(a)) / 864e5);
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DSEM = ['dom','seg','ter','qua','qui','sex','sáb'];
const fmtD = s => { if (!s) return '—'; const d = toD(s); return d.getDate() + ' ' + MES[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };
const fmtDL = s => { if (!s) return '—'; const d = toD(s); return DSEM[d.getDay()] + ', ' + d.getDate() + ' ' + MES[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };
const nf = (v, d = 1) => (v === '' || v == null || isNaN(v)) ? '—' : Number(v).toLocaleString('pt-BR', {maximumFractionDigits:d, minimumFractionDigits:0});
const nf0 = v => nf(v, 0);
const r1 = v => Math.round(v * 10) / 10;
const isNum = v => v !== '' && v != null && !isNaN(v) && isFinite(v);
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const lsGet = k => { try { return localStorage.getItem(APP + '.' + k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { v === null ? localStorage.removeItem(APP + '.' + k) : localStorage.setItem(APP + '.' + k, v); } catch(e){} };
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role','status'); document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function ageAt(nasc, ref){ if (!nasc) return null; const a = toD(nasc), b = toD(ref || today()); let y = b.getFullYear() - a.getFullYear(); if (b.getMonth() < a.getMonth() || (b.getMonth() === a.getMonth() && b.getDate() < a.getDate())) y--; return y; }

/* ===================== ARMAZENAMENTO CIFRADO ===================== */
// raw: o que está gravado (cifrado). items: dados abertos, só em memória enquanto desbloqueado.
// Arquivos (PDFs e fotos) ficam num depósito separado, em pedaços cifrados, e só abrem quando você pede.
const IN_CLAUDE = !!window.claude || !!window.__PREVIEW;
const S = { raw:new Map(), items:new Map(), dels:new Map(), cache:new Map(), mode:'idb', key:null, dkRaw:null, loaded:false, bad:0 };
const RKEY = 'raw';
const LDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('sem indexedDB'));
    const r = indexedDB.open('saude-integral', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('raw', {keyPath:'id'}); r.result.createObjectStore('blob', {keyPath:'id'}); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = async (store, mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction(store, mode), req = fn(t.objectStore(store)); t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return {
    all: () => run('raw', 'readonly', st => st.getAll()), put: rec => run('raw', 'readwrite', st => st.put(rec)),
    putMany: recs => run('raw', 'readwrite', st => { recs.forEach(r => st.put(r)); return null; }),
    bget: id => run('blob', 'readonly', st => st.get(id)), bput: rec => run('blob', 'readwrite', st => st.put(rec)),
    bdel: id => run('blob', 'readwrite', st => st.delete(id)), ball: () => run('blob', 'readonly', st => st.getAll()),
  };
})();
function saveLocal(){ if (S.mode === 'local') lsSet(RKEY, JSON.stringify([...S.raw.values()])); }
const lockDoc = () => S.raw.get('lock');
async function writeRaw(rec){
  S.raw.set(rec.id, rec);
  if (S.mode === 'idb'){ try { await LDB.put(rec); } catch(e){ toast('Não foi possível salvar neste aparelho. Libere espaço e tente de novo.'); } }
  else saveLocal();
}
async function sealItem(item){ const c = await CRYPTO.enc(S.key, item); S.cache.set(c.ct, item); return {id:item.id, kind:'enc', iv:c.iv, ct:c.ct, u:+item.upd || 0}; }
async function storeItems(list){
  for (const it of list){ if (it.kind === 'del'){ S.items.delete(it.id); S.dels.set(it.id, it); } else { S.dels.delete(it.id); S.items.set(it.id, it); } }
  render();
  for (const it of list) await writeRaw(await sealItem(it));
  if (FB.sess) fbMark(list.map(i => i.id));
}
async function put(item){ if (!S.key) return; await storeItems([{...item, upd:Date.now()}]); }

/* ===================== ARQUIVOS (exames, receitas, fotos) ===================== */
// Cada arquivo é cortado em pedaços de 450 KB, cifrados com a mesma chave dos dados.
// No Firebase, cada pedaço vira um documento (limite gratuito de 1 MB por documento): custo zero, sem Storage pago.
const BLOB_CHUNK = 450 * 1024, BLOB_MAX = 12 * 1024 * 1024;
async function blobSave(fileId, bytes){
  const n = Math.max(1, Math.ceil(bytes.length / BLOB_CHUNK));
  for (let i = 0; i < n; i++){
    const c = await CRYPTO.encBytes(S.key, bytes.subarray(i * BLOB_CHUNK, (i + 1) * BLOB_CHUNK));
    const rec = {id:`${fileId}_${i}`, iv:c.iv, ct:c.ct};
    await LDB.bput(rec);
    if (FB.sess){ FB.bdirty.add(rec.id); }
  }
  if (FB.sess){ lsSet('bdirty', JSON.stringify([...FB.bdirty])); clearTimeout(FB.timer); FB.timer = setTimeout(fbSync, 800); }
  return n;
}
async function blobLoad(fileId, n, mime){
  const parts = [];
  for (let i = 0; i < n; i++){
    const id = `${fileId}_${i}`; let rec = null;
    try { rec = await LDB.bget(id); } catch(e){}
    if (!rec && FB.sess){ rec = await fbGetBlob(id); if (rec) try { await LDB.bput(rec); } catch(e){} }
    if (!rec) throw new Error(FB.sess ? 'Pedaço do arquivo não encontrado na nuvem.' : 'Este arquivo está em outro aparelho. Ative a sincronização para trazê-lo.');
    parts.push(await CRYPTO.decBytes(S.key, rec));
  }
  return new Blob(parts, {type: mime || 'application/octet-stream'});
}
async function blobDelete(fileId, n){
  for (let i = 0; i < n; i++){ const id = `${fileId}_${i}`; try { await LDB.bdel(id); } catch(e){} if (FB.sess){ FB.bdirty.delete(id); FB.bdel.add(id); } }
  if (FB.sess){ lsSet('bdirty', JSON.stringify([...FB.bdirty])); lsSet('bdel', JSON.stringify([...FB.bdel])); fbMark([]); }
}
// Quando a chave dos dados muda (ao ligar a sincronização num aparelho que já tinha dados), os arquivos são cifrados de novo.
async function blobRekey(oldKey, newKey){
  let list = []; try { list = await LDB.ball(); } catch(e){ return; }
  for (const r of list){ try { const b = await CRYPTO.decBytes(oldKey, r); const c = await CRYPTO.encBytes(newKey, b); await LDB.bput({id:r.id, iv:c.iv, ct:c.ct}); } catch(e){} }
}

/* ===================== BLOQUEIO ===================== */
const LOCKUI = { fails: +(lsGet('fails')||0), until: +(lsGet('until')||0), lastActive: Date.now(), hiddenAt: 0, usePass:false };
const IDLE_MS = 10*60*1000, AWAY_MS = 2*60*1000;
const importDK = raw => crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
const sameBytes = (a, b) => a && b && a.length === b.length && a.every((x, i) => x === b[i]);
function lockNow(){ LOCKUI.usePass = false; S.key = null; S.dkRaw = null; if (typeof FB !== 'undefined'){ FB.sess = null; FB.idTok = ''; } S.items = new Map(); S.dels = new Map(); S.cache = new Map(); SESS_DRAFT = null; closeSheet(); render(); }
// A chave dos dados (DK) é aleatória; a senha só a protege. Assim dá para trocar ou redefinir a senha sem recriptografar tudo.
async function createLock(user, pass, dkRaw){
  dkRaw = dkRaw || S.dkRaw || crypto.getRandomValues(new Uint8Array(32));

  const check = await CRYPTO.enc(K, {ok:true, user:user.trim()}), wrap = await CRYPTO.enc(K, {dk:CRYPTO.b64(dkRaw)});
  const rekey = !(S.dkRaw && sameBytes(S.dkRaw, dkRaw));

  if (rekey){ S.cache = new Map(); for (const it of [...S.items.values(), ...S.dels.values()]) await writeRaw(await sealItem(it)); if (oldKey) await blobRekey(oldKey, S.key); }

}
async function unlock(user, pass){
  const L = lockDoc(), K = await CRYPTO.derive(user, pass, L.salt, L.iter);

  catch(e){ return false; }
  const w = await CRYPTO.dec(K, L.wrap); S.dkRaw = CRYPTO.unb64(w.dk); S.key = await importDK(S.dkRaw); await openAll();

  e.preventDefault();

  if (!window.crypto?.subtle) return err.textContent = 'Este navegador não permite criptografia nesta página. Abra pelo link https do app.';

const PIN_KEY = 'pin', PIN_ITER = 400000;
const pinDoc = () => { try { return JSON.parse(lsGet(PIN_KEY) || 'null'); } catch(e){ return null; } };
async function pinKey(pin, salt, iter){ const base = await crypto.subtle.importKey('raw', new TextEncoder().encode('pin\n' + pin), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2', salt:CRYPTO.unb64(salt), iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']); }

async function unlockPin(pin){
  const P = pinDoc(); if (!P) return 'none';
  try { const k = await pinKey(pin, P.salt, P.iter), w = await CRYPTO.dec(k, P.wrap); S.dkRaw = CRYPTO.unb64(w.dk); S.key = await importDK(S.dkRaw); await openAll(); if (S.bad && !S.items.size){ lsSet(PIN_KEY, null); lockNow(); return 'wiped'; } lsSet(PIN_KEY, JSON.stringify({...P, fails:0})); return 'ok'; }
  catch(e){ const f = (P.fails || 0) + 1; if (f >= 5){ lsSet(PIN_KEY, null); return 'wiped'; } lsSet(PIN_KEY, JSON.stringify({...P, fails:f})); return 5 - f; }
}

/* ===================== SINCRONIZAÇÃO AUTOMÁTICA (FIREBASE GRATUITO) ===================== */
// Usa o mesmo projeto Firebase da Caderneta, em coleções separadas e com chave própria.
// Os registros sobem já cifrados. Uma cópia da chave dos dados fica na conta Firebase, protegida pelas regras de acesso:
// é ela que permite recuperar tudo pelo e-mail se a senha for esquecida.
const FB = { cfg:null, sess:null, idTok:'', exp:0, state:'off', busy:false, last:0, err:'', timer:null,
  dirty:new Set(JSON.parse(lsGet('dirty') || '[]')), bdirty:new Set(JSON.parse(lsGet('bdirty') || '[]')), bdel:new Set(JSON.parse(lsGet('bdel') || '[]')) };
const COL_REC = 'saude_rec', COL_BLOB = 'saude_blob', KEY_DOC = 'saude_keys';
const AUTH_ERR = /TOKEN_EXPIRED|INVALID_REFRESH_TOKEN|USER_NOT_FOUND|USER_DISABLED|INVALID_ID_TOKEN|CREDENTIAL_TOO_OLD|UNAUTHENTICATED/;
function fbParseCfg(t){
  const k = String(t||'').match(/apiKey\s*[:=]\s*["']([^"']+)["']/), p = String(t||'').match(/projectId\s*[:=]\s*["']([^"']+)["']/);
  return k && p && !/cole|sua|xxx/i.test(k[1]) ? {apiKey:k[1].trim(), projectId:p[1].trim()} : null;
}
async function fbLoadCfg(){
  if (IN_CLAUDE) return;
  if (/^https?:$/.test(location.protocol)){
    try { const r = await fetch('firebase-config.txt', {cache:'no-store'}); if (r.ok){ const c = fbParseCfg(await r.text()); if (c){ FB.cfg = c; lsSet('fbcfg', JSON.stringify(c)); return; } } } catch(e){}
  }
  try { FB.cfg = JSON.parse(lsGet('fbcfg') || 'null'); } catch(e){ FB.cfg = null; }
}
async function fbReq(url, body, token, form, method){
  const r = await fetch(url, {method: method || (body ? 'POST' : 'GET'), headers: {'Content-Type': form ? 'application/x-www-form-urlencoded' : 'application/json', ...(token ? {Authorization:'Bearer ' + token} : {})}, body: body ? (form ? body : JSON.stringify(body)) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok){ const e = new Error(j?.error?.message || ('HTTP ' + r.status)); e.status = r.status; e.code = String(j?.error?.message || j?.error?.status || ''); throw e; }

}
const fbIdt = path => `https://identitytoolkit.googleapis.com/v1/accounts:${path}?key=${FB.cfg.apiKey}`;
const fbBase = () => `https://firestore.googleapis.com/v1/projects/${FB.cfg.projectId}/databases/(default)/documents`;
const fbUserPath = () => `${fbBase()}/users/${FB.sess.uid}`;
const fbDocName = (col, id) => `projects/${FB.cfg.projectId}/databases/(default)/documents/users/${FB.sess.uid}/${col}/${id}`;
function fbSetAuth(a, email){
  FB.sess = {uid:a.localId || a.user_id, email:(email || a.email || FB.sess?.email || '').toLowerCase(), refresh:a.refreshToken || a.refresh_token};
  FB.idTok = a.idToken || a.id_token; FB.exp = Date.now() + (+(a.expiresIn || a.expires_in || 3600)) * 1000;

}
const fbSignIn = (email, pass) => fbReq(fbIdt('signInWithPassword'), {email, password:pass, returnSecureToken:true});
const fbSignUp = (email, pass) => fbReq(fbIdt('signUp'), {email, password:pass, returnSecureToken:true});

async function fbToken(){
  if (FB.idTok && Date.now() < FB.exp - 60000) return FB.idTok;
  const a = await fbReq(`https://securetoken.googleapis.com/v1/token?key=${FB.cfg.apiKey}`, `grant_type=refresh_token&refresh_token=${encodeURIComponent(FB.sess.refresh)}`, null, true);
  fbSetAuth(a); await fbSaveSess(); return FB.idTok;
}
async function fbSaveSess(){ if (!S.key || !FB.sess) return; const c = await CRYPTO.enc(S.key, FB.sess); await writeRaw({id:'fbsess', kind:'sess', iv:c.iv, ct:c.ct}); }
async function fbLoadSess(){
  const r = S.raw.get('fbsess'); FB.sess = null; FB.idTok = ''; FB.exp = 0;
  if (!r || r.kind !== 'sess' || !S.key || !FB.cfg) { FB.state = 'off'; return; }
  try { FB.sess = await CRYPTO.dec(S.key, r); FB.state = 'ok'; } catch(e){ FB.state = 'off'; }
}
async function fbGetKey(){
  try { const d = await fbReq(`${fbUserPath()}/meta/${KEY_DOC}`, null, await fbToken()); return d.fields?.dk?.stringValue ? CRYPTO.unb64(d.fields.dk.stringValue) : null; }
  catch(e){ if (e.status === 404) return null; throw e; }
}
async function fbPutKey(raw){ await fbReq(`${fbBase()}:commit`, {writes:[{update:{name:fbDocName('meta', KEY_DOC), fields:{dk:{stringValue:CRYPTO.b64(raw)}, v:{integerValue:'1'}}}}]}, await fbToken()); }
function fbMark(ids){ if (!FB.sess) return; ids.forEach(id => FB.dirty.add(id)); lsSet('dirty', JSON.stringify([...FB.dirty])); clearTimeout(FB.timer); FB.timer = setTimeout(fbSync, 1500); }
async function fbPush(){
  const ids = [...FB.dirty];
  // Lotes limitados por tamanho (o Firestore aceita até 10 MB por envio).
  let batch = [], bytes = 0;
  const flush = async () => { if (!batch.length) return; await fbReq(`${fbBase()}:commit`, {writes:batch.map(b => b.w)}, await fbToken()); batch.forEach(b => FB.dirty.delete(b.id)); lsSet('dirty', JSON.stringify([...FB.dirty])); batch = []; bytes = 0; };
  for (const id of ids){
    const r = S.raw.get(id);

    const size = r.ct.length + 200;
    if (batch.length >= 400 || bytes + size > 6e6) await flush();
    batch.push({id, w:{update:{name:fbDocName(COL_REC, id), fields:{iv:{stringValue:r.iv}, ct:{stringValue:r.ct}, u:{integerValue:String(+r.u || 0)}}}}}); bytes += size;

}
async function fbPushBlobs(){
  for (const id of [...FB.bdirty]){
    let r = null; try { r = await LDB.bget(id); } catch(e){}
    if (r) await fbReq(`${fbBase()}:commit`, {writes:[{update:{name:fbDocName(COL_BLOB, id), fields:{iv:{stringValue:r.iv}, ct:{stringValue:r.ct}}}}]}, await fbToken());
    FB.bdirty.delete(id); lsSet('bdirty', JSON.stringify([...FB.bdirty]));
  }
  const dels = [...FB.bdel];
  for (let i = 0; i < dels.length; i += 300){
    const chunk = dels.slice(i, i + 300);
    await fbReq(`${fbBase()}:commit`, {writes:chunk.map(id => ({delete:fbDocName(COL_BLOB, id)}))}, await fbToken());
    chunk.forEach(id => FB.bdel.delete(id)); lsSet('bdel', JSON.stringify([...FB.bdel]));
  }
}
async function fbGetBlob(id){
  try { const d = await fbReq(`${fbUserPath()}/${COL_BLOB}/${id}`, null, await fbToken()); return d.fields ? {id, iv:d.fields.iv.stringValue, ct:d.fields.ct.stringValue} : null; }
  catch(e){ if (e.status === 404) return null; throw e; }
}

    const sq = {from:[{collectionId:COL_REC}], orderBy:[{field:{fieldPath:'u'}, direction:'ASCENDING'}, {field:{fieldPath:'__name__'}, direction:'ASCENDING'}], limit:300};
    sq.startAt = cursor ? {values:[{integerValue:String(cursor.u)}, {referenceValue:cursor.n}], before:false} : {values:[{integerValue:String(Math.max(0, maxU - 600000))}], before:true};
    const res = await fbReq(`${fbUserPath()}:runQuery`, {structuredQuery:sq}, await fbToken());
    const docs = (res || []).filter(x => x.document).map(x => x.document);
    for (const d of docs){
      const id = d.name.split('/').pop(), u = +(d.fields?.u?.integerValue || 0), loc = S.raw.get(id);
      if (u > maxU) maxU = u;
      if (loc && (+loc.u || 0) >= u) continue;
      const rec = {id, kind:'enc', iv:d.fields.iv.stringValue, ct:d.fields.ct.stringValue, u};

async function fbEnable(email, pass){

  try { a = await fbSignIn(email, pass); }
  catch(e){
    if (!/INVALID_LOGIN_CREDENTIALS|EMAIL_NOT_FOUND|INVALID_PASSWORD/.test(e.code)) throw e;
    try { a = await fbSignUp(email, pass); } catch(e2){ if (/EMAIL_EXISTS/.test(e2.code)) throw new Error('Senha incorreta para este e-mail. Use a mesma senha da sincronização da Caderneta.'); throw e2; }
  }
  fbSetAuth(a, email);
  const remote = await fbGetKey();
  if (!remote) await fbPutKey(S.dkRaw);
  else if (!sameBytes(remote, S.dkRaw)){ const oldKey = S.key; S.key = await importDK(remote); S.dkRaw = remote; await blobRekey(oldKey, S.key); }
  S.cache = new Map();
  const items = [...S.items.values(), ...S.dels.values()];
  for (const it of items) await writeRaw(await sealItem(it));
  await createLock(lsGet('user') || email, pass, S.dkRaw);
  await fbSaveSess(); FB.state = 'ok';
  (await fbAllBlobIds()).forEach(id => FB.bdirty.add(id)); lsSet('bdirty', JSON.stringify([...FB.bdirty]));

}

// Tipos de campo: text, number, date, time, select, check, textarea, scale (0–10 por toque), seg (opções por toque), title (separador).
function field(f, v){
  const id = 'f-' + f.k, val = v ?? f.def ?? '', w = `id="w-${f.k}" ${f.hidden?'hidden':''}`;
  const cls = f.full ? 'f full' : 'f';
  const hint = f.hint ? `<span class="hint">${f.hint}</span>` : '';
  if (f.type === 'title') return `<div class="fieldset" ${w}>${f.label}${f.hint ? `<small>${f.hint}</small>` : ''}</div>`;
  if (f.type === 'html') return `<div class="full" ${w}>${f.html}</div>`;
  if (f.type === 'select') return `<label class="${cls}" ${w}>${f.label}<select id="${id}">${f.options.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(val)===String(ov)?'selected':''}>${esc(ol)}</option>`; }).join('')}</select>${hint}</label>`;
  if (f.type === 'check') return `<label class="check full" ${w}><input id="${id}" type="checkbox" ${val?'checked':''}> <span>${f.label}</span></label>`;
  if (f.type === 'textarea') return `<label class="${cls}" ${w}>${f.label}<textarea id="${id}" rows="${f.rows||3}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}>${esc(val)}</textarea>${hint}</label>`;
  if (f.type === 'scale' || f.type === 'seg'){
    const opts = f.type === 'scale' ? Array.from({length:(f.max ?? 10) - (f.min ?? 0) + 1}, (_, i) => [String(i + (f.min ?? 0)), String(i + (f.min ?? 0))]) : f.options.map(o => Array.isArray(o) ? o.map(String) : [String(o), String(o)]);
    return `<div class="f full" ${w}><span>${f.label}</span><input type="hidden" id="${id}" value="${esc(val)}"><div class="scale ${f.type === 'seg' ? 'wide' : ''}" role="radiogroup" aria-label="${esc(f.label)}">${opts.map(([ov, ol]) => `<button type="button" role="radio" aria-checked="${String(val) === ov}" class="${String(val) === ov ? 'on' : ''}" data-scale="${f.k}|${esc(ov)}">${esc(ol)}</button>`).join('')}</div>${f.type === 'scale' && f.lo ? `<div class="scale-l"><span>${f.lo}</span><span>${f.hi || ''}</span></div>` : ''}${hint}</div>`;
  }
  return `<label class="${cls}" ${w}>${f.label}<input id="${id}" type="${f.type||'text'}" ${f.type==='number'?'step="any" inputmode="decimal"':''} ${f.type==='password'?'autocomplete="new-password"':''} ${f.list?`list="${f.list}" autocomplete="off"`:''} value="${esc(val)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}>${hint}</label>`;
}
function readForm(fields){
  const o = {};
  for (const f of fields){ if (f.type === 'title' || f.type === 'html') continue; const el = document.getElementById('f-'+f.k); if (!el) continue;
    if (f.type === 'check') o[f.k] = el.checked;
    else if (f.type === 'number'){ const t = String(el.value).replace(',', '.'); o[f.k] = t === '' ? '' : Number(t); }
    else if (f.type === 'scale'){ o[f.k] = el.value === '' ? '' : Number(el.value); }
    else if (f.type === 'password') o[f.k] = el.value;
    else o[f.k] = el.value.trim(); }
  return o;
}

async function saveFile(name, data, type = 'application/json'){
  if (IN_CLAUDE && window.claude?.use){
    try { const dl = await window.claude.use('downloads'); if (dl){ await dl.save({filename:name, data}); return true; } }
    catch(e){ if (e?.code === 'declined') return false; }
  }
  const blob = new Blob([data], {type});
  try {
    const file = new File([blob], name, {type});
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && navigator.canShare?.({files:[file]})){ await navigator.share({files:[file], title:name}); return true; }
  } catch(e){ if (e?.name === 'AbortError') return false; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return true;
}

  const L = lockDoc(); if (!L) return false;

}
async function mergeItems(list){
  const apply = [];
  for (const x of list || []){
    if (!x || !x.id || !x.kind || ['lock','enc','sess','off'].includes(x.kind)) continue;
    const cur = S.items.get(x.id) || S.dels.get(x.id);
    if (!cur || (+x.upd || 0) > (+cur.upd || 0) || !x.upd) apply.push({...x, upd: x.upd || Date.now()});
  }
  if (apply.length) await storeItems(apply);
  return apply.length;
}

// Interpreta "200 g de fraldinha e 150 g de arroz" em pedaços com quantidade e nome.
function parseMealText(t){
  const pieces = String(t || '').replace(/\s+\+\s+/g, '\n').split(/\n|;|,(?!\d)|\s+e\s+(?=\d)|\s+com\s+(?=\d)/i).map(s => s.trim()).filter(Boolean);
  return pieces.map(p => {
    let m = p.match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|gr|gramas?|ml)\b\.?\s*(?:de\s+|do\s+|da\s+)?(.+)$/i);
    if (m){ let q = +m[1].replace(',', '.'); if (/kg/i.test(m[2])) q *= 1000; return {q, un:/ml/i.test(m[2]) ? 'ml' : 'g', nome:m[3].trim(), raw:p}; }
    m = p.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*(kg|g|gr|gramas?|ml)\b\.?$/i);
    if (m){ let q = +m[2].replace(',', '.'); if (/kg/i.test(m[3])) q *= 1000; return {q, un:/ml/i.test(m[3]) ? 'ml' : 'g', nome:m[1].trim(), raw:p}; }
    m = p.match(/^(\d+(?:[.,]\d+)?|uma?|duas|dois|tr[eê]s|meia|meio)\s+(.+)$/i);
    if (m) return {q:'', un:'', nome:m[2].trim(), raw:p, porcaoTxt:m[1]};
    return {q:'', un:'', nome:p, raw:p};
  });
}

function ckdEpi2021(scr, idade, sexo){

// series: [{pts:[{x:'AAAA-MM-DD', y}], cls:'main'|'avg'}], opt: {ref:[min,max], fmt, h}
function lineChart(series, opt = {}){
  const W = 640, H = opt.h || 200, L = 44, Rr = 14, T = 12, B = 26;
  const pts = series.flatMap(s => s.pts).filter(p => isNum(p.y));
  if (pts.length < 2) return `<p class="note">${pts.length ? 'Um registro só: o gráfico aparece a partir do segundo.' : 'Sem registros neste período.'}</p>`;
  const xs = pts.map(p => toD(p.x).getTime()); let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1 === x0) x1 = x0 + 864e5;
  let ys = pts.map(p => +p.y); if (opt.ref){ opt.ref.forEach(v => isNum(v) && ys.push(+v)); }
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * 0.12 || Math.abs(y1) * 0.05 || 1; y0 -= pad; y1 += pad;
  const sx = x => L + (toD(x).getTime() - x0) / (x1 - x0) * (W - L - Rr), sy = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  const fmt = opt.fmt || (v => nf(v, Math.abs(y1 - y0) < 5 ? 1 : 0));
  const ticks = []; for (let i = 0; i <= 3; i++) ticks.push(y0 + (y1 - y0) * i / 3);
  const dTicks = [x0, (x0 + x1) / 2, x1].map(t => iso(new Date(t)));
  let band = '';
  if (opt.ref && (isNum(opt.ref[0]) || isNum(opt.ref[1]))){ const a = isNum(opt.ref[1]) ? sy(+opt.ref[1]) : T, b = isNum(opt.ref[0]) ? sy(+opt.ref[0]) : H - B; band = `<rect x="${L}" y="${Math.min(a, b)}" width="${W - L - Rr}" height="${Math.abs(b - a)}" fill="var(--pos)" fill-opacity=".09"/>`; }
  const lines = series.map(s => { const p = s.pts.filter(q => isNum(q.y)); if (!p.length) return ''; const d = p.map((q, i) => `${i ? 'L' : 'M'}${sx(q.x).toFixed(1)},${sy(+q.y).toFixed(1)}`).join(''); const main = s.cls !== 'avg';
    return `<path d="${d}" fill="none" stroke="${main ? 'var(--accent)' : 'var(--h-orange)'}" stroke-width="${main ? 2.2 : 2}" ${main ? '' : 'stroke-dasharray="5 4"'} stroke-linejoin="round" stroke-linecap="round"/>` + (main ? p.map((q, i) => `<circle cx="${sx(q.x).toFixed(1)}" cy="${sy(+q.y).toFixed(1)}" r="${i === p.length - 1 ? 4 : 2.6}" fill="${i === p.length - 1 ? 'var(--accent)' : 'var(--card)'}" stroke="var(--accent)" stroke-width="1.8"><title>${fmtD(q.x)}: ${fmt(q.y)}</title></circle>`).join('') : ''); }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || 'Gráfico')}">${band}${ticks.map(v => `<line x1="${L}" x2="${W - Rr}" y1="${sy(v).toFixed(1)}" y2="${sy(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${(sy(v) + 4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`).join('')}${dTicks.map((d, i) => `<text x="${sx(d).toFixed(1)}" y="${H - 6}" text-anchor="${['start', 'middle', 'end'][i]}">${fmtD(d)}</text>`).join('')}${lines}</svg></div>`;
}

function vAliSintomas(){
  const t = today(), de = addDays(t, -89), dias = diasReg(de, t);
  const ruim = d => (+d.evac >= 4) || (+d.dorAbd >= 4) || (+d.gases >= 6) || (+d.dist >= 6) || d.sangue === 'pouco' || d.sangue === 'muito';
  const bad = dias.filter(ruim), good = dias.filter(d => !ruim(d));
  const foodsOf = d => new Set([...mealsOn(d), ...mealsOn(addDays(d, -1))].flatMap(m => (m.itens || []).map(i => shortFood(i.nome).split(',')[0].trim().toLowerCase())).filter(Boolean));
  const cnt = (list) => { const c = {}; list.forEach(d => foodsOf(d.data).forEach(f => c[f] = (c[f] || 0) + 1)); return c; };
  const cb = cnt(bad), cg = cnt(good);
  const rows = Object.keys(cb).filter(f => cb[f] >= 3).map(f => ({f, b:cb[f], g:cg[f] || 0, pb:cb[f] / bad.length, pg:good.length ? (cg[f] || 0) / good.length : 0})).filter(r => r.pb > r.pg).sort((a, b) => (b.pb - b.pg) - (a.pb - a.pg)).slice(0, 12);
  return `<div class="card"><h3>Alimentos × sintomas digestivos</h3>

    <p class="note">Período: ${fmtD(de)} a ${fmtD(t)} · ${dias.length} dia(s) com diário · ${bad.length} com desconforto (4+ evacuações, dor abdominal 4+, gases ou distensão 6+, ou sangue) · ${good.length} tranquilos.</p>
    ${bad.length < 5 || good.length < 5 ? `<p class="note"><b>Poucos dados ainda.</b> A comparação começa a fazer sentido com pelo menos 5 dias de cada tipo, com diário e refeições registrados.</p>` : rows.length ? `<div class="tbl-wrap"><table class="grid"><thead><tr><th>Alimento</th><th class="r">Dias com desconforto</th><th class="r">Dias tranquilos</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(cap(r.f))}</td><td class="r">${r.b} (${nf0(r.pb * 100)}%)</td><td class="r">${r.g} (${nf0(r.pg * 100)}%)</td></tr>`).join('')}</tbody></table></div>` : '<p class="note">Nenhum alimento se destacou nos dias com desconforto.</p>'}</div>`;
}

async function prepFile(f){
  if (/^image\//.test(f.type) && !/gif|svg/.test(f.type)){
    try { const bmp = await createImageBitmap(f); const sc = Math.min(1, 2000 / Math.max(bmp.width, bmp.height)); const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc); c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82)); if (b) return {bytes:new Uint8Array(await b.arrayBuffer()), mime:'image/jpeg'}; } catch(e){}
  }
  return {bytes:new Uint8Array(await f.arrayBuffer()), mime:f.type || 'application/octet-stream'};
}

/* ===================== TREINO 2: PLANO DO PERSONAL, MEMÓRIA DE CARGAS, DESCANSO ===================== */
// Plano: fases por semana (ex.: semanas 1–2 RIR 3, 3–4 RIR 2–3), aquecimentos por ficha, regras e o que evitar.
const plano = () => get('plano');
function planWeek(){ const P = plano(); if (!P?.inicio) return null; return Math.max(1, Math.floor(daysBetween(P.inicio, today()) / 7) + 1); }
function planFase(){ const P = plano(), w = planWeek(); if (!P || !w) return null; return (P.fases || []).find(f => !f.ate || w <= f.ate) || null; }
// "10-12", "10–12 por lado", "12" → {min, max}
function repsRange(s){ const m = String(s || '').match(/(\d+)\s*(?:[-–a]\s*(\d+))?/); return m ? {min:+m[1], max:+(m[2] || m[1])} : null; }
const unidEx = e => (e && e.unid) || 'kg';
const fmtLoad = (kg, e) => isNum(kg) && kg !== '' ? `${nf(kg)} ${unidEx(e)}` : '—';
// Todas as vezes que o exercício foi feito (mais recente primeiro), só séries com repetições registradas.
function exHistory(exId){
  return all('sessao').filter(s => s.status !== 'andamento').flatMap(s => (s.itens || []).filter(i => i.exer === exId && !i.pulado).map(i => ({data:s.data, sess:s.id, it:i, sets:(i.sets || []).filter(x => isNum(x.reps) && x.reps !== '')})))
    .filter(h => h.sets.length).sort((a, b) => a.data < b.data ? 1 : a.data > b.data ? -1 : 0);
}
const topKg = h => Math.max(...h.sets.map(x => isNum(x.kg) && x.kg !== '' ? +x.kg : 0));
const setsTxt = (h, e) => h.sets.map(x => `${isNum(x.kg) && x.kg !== '' ? nf(x.kg) : '–'}×${x.reps}`).join(' · ') + (e ? ` ${unidEx(e)}` : '');
// Sinal de progressão, seguindo a regra do personal: execução > controle > amplitude > repetições > carga.
// Nunca aumenta nada sozinho: só avisa quando os critérios foram cumpridos, para você combinar com o personal.
function progSinal(exId, alvo, trava){
  if (trava) return {cls:'pend', t:'Sem progressão hoje (check-in ou dor). Repita ou reduza a carga.'};
  const H = exHistory(exId), r = repsRange(alvo?.reps), f = planFase();
  if (!H.length) return {cls:'', t:'Primeira vez: carga leve, foco na técnica. Anote o peso para lembrar na próxima.'};
  if (!r) return {cls:'', t:'Repita a carga da última vez.'};
  const ok = h => h.sets.length >= (+alvo.series || 1) && h.sets.every(x => +x.reps >= r.max) && new Set(h.sets.map(x => String(x.kg))).size === 1 && !(isNum(h.it.dor) && +h.it.dor >= 3) && !(isNum(h.it.rir) && h.it.rir !== '' && +h.it.rir < 2);
  if (f && f.semCarga) return {cls:'', t:`Fase de técnica (${esc(f.nome || '')}): mantenha a carga e priorize execução e controle.`};
  if (H.length >= 2 && ok(H[0]) && ok(H[1]) && topKg(H[0]) === topKg(H[1])) return {cls:'ok', t:`Pronto para evoluir: ${r.max} repetições em todas as séries nos 2 últimos treinos, sem dor. Combine com o personal um pequeno aumento.`};
  if (ok(H[0])) return {cls:'', t:`Bateu ${r.max} repetições em todas as séries. Repita a carga mais uma vez para confirmar.`};
  return {cls:'', t:`Mantenha ${fmtLoad(topKg(H[0]), get(exId))} e busque ${r.max} repetições com técnica.`};
}
function sparkline(vals){
  const v = vals.filter(isNum); if (v.length < 2) return '';
  const W = 90, H = 26, mn = Math.min(...v), mx = Math.max(...v), d = mx - mn || 1;
  const pts = v.map((y, i) => `${(i / (v.length - 1) * (W - 4) + 2).toFixed(1)},${(H - 3 - (y - mn) / d * (H - 6)).toFixed(1)}`);
  const last = pts[pts.length - 1].split(',');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" style="flex:none"><polyline points="${pts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="var(--accent)"/></svg>`;
}

/* ---------- aba Cargas: consulta rápida na academia ---------- */
function vCargas(){
  const fichas = all('ficha').sort((a, b) => (a.ordem || 0) - (b.ordem || 0) || a.nome.localeCompare(b.nome));
  const q = norm(UI.cargaQ || '');
  const seen = new Set(), groups = [];
  fichas.forEach(f => { const items = (f.itens || []).filter(it => { const e = get(it.exer); return e && (!q || norm(e.nome + ' ' + (e.nomeEn || '')).includes(q)); }); if (items.length) groups.push([f.nome, items]); items.forEach(it => seen.add(it.exer)); });
  const avulsos = all('exer').filter(e => !seen.has(e.id) && exHistory(e.id).length && (!q || norm(e.nome).includes(q)));
  if (avulsos.length) groups.push(['Fora das fichas', avulsos.map(e => ({exer:e.id}))]);
  const row = it => { const e = get(it.exer), H = exHistory(it.exer), h = H[0], first = H[H.length - 1];
    const delta = h && first && h !== first ? topKg(h) - topKg(first) : null;
    return `<div class="item" role="button" tabindex="0" data-cargadet="${it.exer}"><div class="main"><div class="t">${esc(e.nome)}</div><div class="m">${h ? `${fmtD(h.data)}: <b style="color:var(--ink)">${setsTxt(h, e)}</b>` : 'Ainda sem registro'}${e.minhaReg ? ` · ${esc(e.minhaReg)}` : ''}</div></div>${sparkline(H.slice().reverse().map(topKg))}<div class="amt" style="min-width:64px">${h ? fmtLoad(topKg(h), e) : '—'}${delta ? `<div class="m note" style="color:${delta > 0 ? 'var(--pos)' : 'var(--muted)'}">${delta > 0 ? '+' : ''}${nf(delta)} desde o início</div>` : ''}</div></div>`; };
  return `<div class="card"><div class="card-head"><h3>Minhas cargas</h3><span class="label">última vez de cada exercício</span></div>
    <div class="search" style="margin:4px 0 6px">${ic('search')}<input id="carga-q" value="${esc(UI.cargaQ || '')}" placeholder="Buscar exercício" autocomplete="off"></div>
    ${groups.length ? groups.map(([g, items]) => `<div class="dayhead">${esc(g)}</div><div class="list">${items.map(row).join('')}</div>`).join('') : emptyBox('dumbbell','blue', fichas.length ? 'Nada encontrado.' : 'Importe o treino do personal ou monte suas fichas para ver as cargas aqui.')}
    <p class="foot">Toque num exercício para ver o histórico completo, o gráfico e anotar a regulagem do aparelho (altura do banco, pino, apoio).</p></div>`;
}

/* ---------- cronômetro de descanso ---------- */
const REST = {end:0, label:'', tm:null, ctx:null};
function restSecs(alvo){ const m = String(alvo?.desc ?? '').match(/\d+/); return m ? +m[0] : 60; }
function startRest(sec, label){
  REST.end = Date.now() + sec * 1000; REST.label = label || '';
  try { REST.ctx = REST.ctx || new (window.AudioContext || window.webkitAudioContext)(); REST.ctx.resume?.(); } catch(e){}
  clearInterval(REST.tm); REST.tm = setInterval(drawRest, 250); drawRest();
}
function stopRest(){ clearInterval(REST.tm); REST.end = 0; const b = $('#restbar'); if (b) b.hidden = true; document.body.classList.remove('resting'); }
function beep(){ try { const c = REST.ctx; if (!c) return; [0, .22, .44].forEach(t => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.0001, c.currentTime + t); g.gain.exponentialRampToValueAtTime(.25, c.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + t + .18); o.connect(g).connect(c.destination); o.start(c.currentTime + t); o.stop(c.currentTime + t + .2); }); } catch(e){} try { navigator.vibrate?.([200, 100, 200]); } catch(e){} }
function drawRest(){
  let b = $('#restbar');
  if (!b){ b = document.createElement('div'); b.id = 'restbar'; b.className = 'restbar'; b.setAttribute('role', 'timer'); document.body.appendChild(b); }
  const left = Math.ceil((REST.end - Date.now()) / 1000);
  if (left <= 0){ clearInterval(REST.tm); b.hidden = false; b.classList.add('done'); b.innerHTML = `<span class="rb-main">${ic('check')}<span class="rb-txt"><b style="font-size:15px">Descanso terminado</b>${REST.label ? `<small>${esc(REST.label)}</small>` : ''}</span></span><button class="btn sm" data-act="rest-stop">OK</button>`; beep(); REST.end = 0; setTimeout(() => { if (!REST.end){ const x = $('#restbar'); if (x) x.hidden = true; document.body.classList.remove('resting'); } }, 6000); return; }
  b.hidden = false; b.classList.remove('done'); document.body.classList.add('resting');
  b.innerHTML = `<span class="rb-main">${ic('clock')}<b class="num">${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</b><span class="rb-txt">descanso${REST.label ? `<small>${esc(REST.label)}</small>` : ''}</span></span><span class="row" style="gap:6px;flex:none"><button class="btn sm" data-act="rest-plus">+15 s</button><button class="btn sm" data-act="rest-stop">Pular</button></span>`;
}

  toast('Arquivo não reconhecido: escolha um backup ou o arquivo de perfil do app Saúde');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && SHEET) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][tabindex]')){ e.preventDefault(); e.target.click(); }
});
if ('serviceWorker' in navigator && !IN_CLAUDE && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
render(); initStore();

</script>
